# Required cargo-deny policy for the Rust product workspace. CI pins cargo-deny 0.20.2 and
# runs all four checks. ADR-0012 narrows ADR-0009 with exactly one audited product dependency:
# wasm-bindgen 0.2.127 in the storage-only bridge. All other external product dependencies
# remain prohibited by scripts/check_isolation.py.

[graph]
all-features = true

[advisories]
version = 2
# Keep the mutable advisory database in ignored build output. This avoids relying on a
# writable user profile in sandboxed development while preserving live database updates.
db-path = "target/cargo-deny-advisory-dbs"
yanked = "deny"
unmaintained = "all"

[licenses]
version = 2
confidence-threshold = 0.93
# First-party workspace crates are unpublished (publish = false) and intentionally carry no
# license yet: the final license decision is deferred (ADR-0004). Skipping our own private
# crates here is NOT a third-party license allowance and does not expand the allowlist
# below. EXTERNAL PRODUCTION DEPENDENCIES REMAIN PROHIBITED (ADR-0009 and the isolation
# gate); the first external dependency ever proposed arrives with its own Dependency Audit,
# never a quiet edit here.
private = { ignore = true }
# Deliberately conservative starting allowlist. Any addition is a reviewed decision,
# recorded in an ADR, not a silent edit. These licenses cover the audited wasm-bindgen
# product closure as well as future candidates only after their own review.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]
# Notable licenses intentionally NOT pre-approved and requiring explicit review:
#   MPL-2.0  - file-level copyleft (relevant to serial-port candidates)
#   GPL-*/AGPL-* - never linked into this project
#   Unlicense/CC0 - reviewed case by case

[bans]
multiple-versions = "warn"
# Wildcard VERSION requirements remain denied for any registry dependency. First-party
# workspace path dependencies carry no version by design (ADR-0009 forbids a path+version
# hybrid), so cargo-deny would otherwise read them as wildcards. allow-wildcard-paths
# permits a wildcard ONLY for path dependencies -- it does not relax the ban for external
# registry dependencies, which remain prohibited.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
