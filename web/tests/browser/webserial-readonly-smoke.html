<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rust WASM Web Serial read-only discovery gate</title>
  </head>
  <body data-result="loading">
    <output id="result">WEB_SERIAL_READONLY_RUNNING:bootstrap</output>
    <script>
      globalThis.addEventListener("error", (event) => {
        document.body.dataset.result = "fail";
        document.querySelector("#result").textContent =
          `WEB_SERIAL_READONLY_BROWSER_FAIL:ModuleError:${event.message}`;
      });
      globalThis.addEventListener("unhandledrejection", (event) => {
        document.body.dataset.result = "fail";
        document.querySelector("#result").textContent =
          `WEB_SERIAL_READONLY_BROWSER_FAIL:UnhandledRejection:${String(event.reason)}`;
      });
    </script>
    <script type="importmap">
      {
        "imports": {
          "virtual:ade-web-readonly-serial-wasm": "./wasm/ade_web_readonly_serial_wasm_bridge.js"
        }
      }
    </script>
    <script src="./webserial-readonly-smoke.mjs" type="module"></script>
  </body>
</html>
