# Structural Cargo workspace for the foundation batch.
#
# There are intentionally NO dependencies in this workspace. Every crate below is a
# placeholder that establishes module boundaries and ownership only. Adding any
# dependency requires its own reviewed pull request together with cargo-deny
# enforcement (see deny.toml and docs/m0/foundations-gate.md).

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Documented MSRV. This is NOT the pinned toolchain: rust-toolchain.toml pins the exact
# toolchain used to build and test. See docs/adr/ADR-0002.
rust-version = "1.85.0"
publish = false

[profile.release]
debug = false
panic = "abort"
