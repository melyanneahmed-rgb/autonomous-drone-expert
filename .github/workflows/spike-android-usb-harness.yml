# CI for the M1C Android USB serial hardware harness (SPIKE).
#
# Runs ONLY for the Android spike branch and its own paths. Adds no requirement to
# `main`, publishes no release, and must never be made a required check.
#
# Action pinning follows the repo convention: exact release tags (commit-SHA pinning
# could not be completed because the third-party-repo GitHub API is unreachable from the
# authoring sandbox; converting tags to SHAs is a tracked follow-up).

name: Spike - Android USB Harness

on:
  push:
    branches:
      - spike/android-usb-serial-harness
    paths:
      - "spikes/android-usb-serial-harness/**"
      - ".github/workflows/spike-android-usb-harness.yml"

permissions:
  contents: read

concurrency:
  group: spike-android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: spikes/android-usb-serial-harness

jobs:
  android-policy-gates:
    name: android-policy-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Payload-write guard selftest
        run: bash scripts/guard_no_payload_writes.sh selftest app/src/main
      - name: Payload-write guard check
        run: bash scripts/guard_no_payload_writes.sh check app/src/main
      - name: Android policy gate (permissions, exports, raw-byte rendering)
        run: python3 scripts/check_android_policy.py
      - name: Repository isolation gate
        working-directory: .
        run: python3 scripts/check_isolation.py

  android-unit-tests:
    name: android-unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

  android-lint:
    name: android-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Lint (debug)
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

  android-assemble-debug:
    name: android-assemble-debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug -PsourceSha=${{ github.sha }} --no-daemon --stacktrace

  android-package-artifact:
    # Packages a PRIVATE debug APK artifact for the operator (7-day retention). Runs only
    # after all quality jobs pass. No release, nothing public, never a required check.
    name: android-package-artifact
    runs-on: ubuntu-latest
    needs: [android-policy-gates, android-unit-tests, android-lint, android-assemble-debug]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Guard - no payload-write calls in main source
        run: bash scripts/guard_no_payload_writes.sh check app/src/main
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -PsourceSha=${{ github.sha }} --no-daemon --stacktrace
      - name: Assemble artifact (apk + sums + build-info + protocol)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/autonomous-drone-expert-m1c-debug.apk
          cp docs/HARDWARE-TEST-PROTOCOL.txt dist/HARDWARE-TEST-PROTOCOL.txt
          GRADLE_V="$(./gradlew --version --no-daemon | awk '/^Gradle /{print $2; exit}')"
          APK_SHA="$(sha256sum dist/autonomous-drone-expert-m1c-debug.apk | awk '{print $1}')"
          STAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > dist/BUILD-INFO.txt <<INFO
          Repository            : ${GITHUB_REPOSITORY}
          Source branch         : ${GITHUB_REF_NAME}
          Source commit SHA     : ${GITHUB_SHA}
          Build timestamp (UTC) : ${STAMP}
          Gradle version        : ${GRADLE_V}
          Android Gradle Plugin : 8.7.3
          Kotlin                : 2.0.21
          compileSdk            : 35
          minSdk                : 24
          targetSdk             : 35
          Application ID        : com.autonomousdroneexpert.m1c
          APK filename          : autonomous-drone-expert-m1c-debug.apk
          APK SHA-256           : ${APK_SHA}

          NO PAYLOAD-BYTE WRITES BY CONSTRUCTION
          SPIKE - DO NOT MERGE
          REQUIRES HARDWARE TEST
          INFO
          cd dist
          sha256sum autonomous-drone-expert-m1c-debug.apk BUILD-INFO.txt HARDWARE-TEST-PROTOCOL.txt > SHA256SUMS.txt
          echo "=== BUILD-INFO.txt ==="; cat BUILD-INFO.txt
          echo "=== SHA256SUMS.txt ==="; cat SHA256SUMS.txt
          echo "=== verify sums ==="; sha256sum -c SHA256SUMS.txt
      - name: Upload private artifact (7-day retention)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: m1c-android-usb-harness-${{ github.sha }}
          path: spikes/android-usb-serial-harness/dist/
          retention-days: 7
          if-no-files-found: error
