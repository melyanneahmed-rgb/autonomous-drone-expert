# Foundation CI.
# Repository Actions policy intentionally allow-lists actions/checkout@v7.0.1 only.
#
# Scope note (honesty): these gates cover the M0 policy foundation, the M1 Mock/Replay Rust
# slice and the M2 product-core crates that are explicitly checked for WebAssembly. Gates
# for UI interaction, USB/DFU, hardware and release publishing are deliberately absent. The
# serial gate is limited to Web Serial read-only identification with an injected CI device;
# it makes no physical-hardware claim. M1 line/branch coverage remains fail-closed for the
# five critical lifecycle files.
#
# Action pinning: actions are pinned to an exact release tag. Pinning to a commit SHA
# could not be completed in the environment that authored this file, because the GitHub
# API for third-party repositories was not reachable from it. Converting these tags to
# SHAs is a tracked follow-up pull request.

name: CI

on:
  push:
    # Keep the protected branch gate and direct validation paths for active feature work.
    branches:
      - main
      - feature/m1-beeper-mock-replay
      - continuation/m1-acceptance-hardening
      - feat/m2-web-dependency-policy
      - feat/webapp-approved-ui-v3
      - feat/m2-web-indexeddb-journal
      - feat/m2-web-storage-wasm-bridge
      - feat/m2-webserial-readonly-discovery
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

# Collapse duplicate push/pull_request delivery for the same revision and cancel stale work.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  web-build:
    name: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Prove runner Node compatibility
        run: |
          node --version
          npm --version
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (!((major === 20 && minor >= 19) || major >= 22)) { console.error(`Node ${process.versions.node} does not satisfy Vite 8.2.1`); process.exit(1); }'

      - name: Prove pinned ephemeral npm
        run: test "$(npx --yes npm@11.13.0 --version)" = "11.13.0"

      - name: Install audited Web package without lifecycle scripts
        working-directory: web
        run: npx --yes npm@11.13.0 ci --ignore-scripts --no-fund

      - name: Typecheck
        working-directory: web
        run: npx --yes npm@11.13.0 run typecheck

      - name: Source, authority, PWA and build contracts
        working-directory: web
        run: npx --yes npm@11.13.0 test

      - name: Real browser IndexedDB journal CAS smoke
        working-directory: web
        run: node --experimental-websocket tests/indexeddb-browser-smoke.mjs

      - name: Install product MSRV with browser target
        run: rustup toolchain install 1.85.0 --profile minimal --target wasm32-unknown-unknown

      - name: Build the storage-only Rust bridge at MSRV
        run: cargo +1.85.0 build --locked --release --target wasm32-unknown-unknown -p ade-web-storage-wasm-bridge

      - name: Build the read-only Web Serial Rust bridge at MSRV
        run: cargo +1.85.0 build --locked --release --target wasm32-unknown-unknown -p ade-web-readonly-serial-wasm-bridge

      - name: Generate Web glue with the isolated pinned tool
        run: |
          mkdir -p target/storage-wasm-web
          cargo run --locked --manifest-path tools/wasm-bindgen-cli-support/Cargo.toml -- \
            target/wasm32-unknown-unknown/release/ade_web_storage_wasm_bridge.wasm \
            target/storage-wasm-web

      - name: Real Chrome Rust WASM and IndexedDB storage gate
        working-directory: web
        run: node --experimental-websocket tests/storage-wasm-browser-smoke.mjs ../target/storage-wasm-web

      - name: Generate read-only Web Serial Web glue with the isolated pinned tool
        run: |
          mkdir -p target/webserial-wasm-web
          cargo run --locked --manifest-path tools/wasm-bindgen-cli-support/Cargo.toml -- \
            target/wasm32-unknown-unknown/release/ade_web_readonly_serial_wasm_bridge.wasm \
            target/webserial-wasm-web

      - name: Real Chrome Rust WASM and Web Serial read-only gate
        working-directory: web
        run: node --experimental-websocket tests/webserial-readonly-browser-smoke.mjs ../target/webserial-wasm-web

      - name: Production build
        working-directory: web
        run: npx --yes npm@11.13.0 run build

      - name: Security audit
        working-directory: web
        run: npx --yes npm@11.13.0 audit --audit-level=high

      - name: Prove package and policy files did not drift
        run: git diff --exit-code -- web/package.json web/package-lock.json policy/web-dependencies.json

  policy-gates:
    name: policy-gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Report Python version
        run: python3 --version

      - name: Isolation, dependency and publication gates
        run: python3 scripts/check_isolation.py

      - name: Audited Web dependency and repository gate
        run: python3 scripts/check_web_dependencies.py

      - name: Web Serial read-only authority gate
        run: python3 scripts/check_webserial_boundary.py

      - name: Unsafe-Rust gate
        run: python3 scripts/check_forbid_unsafe.py

      - name: Provenance gate
        run: python3 scripts/validate_provenance.py

      - name: Local secret-pattern scan
        run: python3 scripts/check_secrets.py

      - name: Policy script regression tests
        run: python3 -m unittest discover -s scripts/tests -v

  rust-linux:
    name: rust-linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Report pinned toolchain
        run: |
          rustup show active-toolchain
          cargo --version
          rustc --version

      - name: Formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path tools/wasm-bindgen-cli-support/Cargo.toml -- --check

      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --locked --manifest-path tools/wasm-bindgen-cli-support/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Non-hardware M1 demonstration
        run: cargo run -p ade-core-api --example m1_mock_demo

  rust-windows:
    name: rust-windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Report pinned toolchain
        run: |
          rustup show active-toolchain
          cargo --version
          rustc --version

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Non-hardware M1 demonstration
        run: cargo run -p ade-core-api --example m1_mock_demo

  rust-msrv:
    # Proves that the declared MSRV is real and not decorative: the workspace is checked
    # with exactly the version in Cargo.toml's rust-version, which is deliberately older
    # than the pinned development toolchain in rust-toolchain.toml. The explicit
    # `+1.85.0` overrides that pin for this job only.
    name: rust-msrv
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install declared MSRV toolchain
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Report both versions
        run: |
          echo "declared MSRV:"
          cargo +1.85.0 --version
          echo "pinned development toolchain:"
          cargo --version

      - name: Check workspace against declared MSRV
        run: cargo +1.85.0 check --workspace --all-targets

      - name: Install isolated tooling MSRV
        run: rustup toolchain install 1.86.0 --profile minimal

      - name: Check isolated WASM tooling against declared MSRV
        run: |
          cargo +1.86.0 check --locked \
            --manifest-path tools/wasm-bindgen-cli-support/Cargo.toml \
            --all-targets

  rust-wasm-core:
    # M2 does not claim that the whole native M1 harness is a browser application. This job
    # proves the protocol-independent planning, journal, host-effect, core API and dedicated
    # read-only serial facade compile for the browser target without native filesystem or
    # browser API crates. The native journal adapter is deliberately absent from this list.
    name: rust-wasm-core
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install browser target for the pinned toolchain
        run: rustup target add wasm32-unknown-unknown

      - name: Check deterministic M2 boundary for WebAssembly
        run: |
          cargo check --target wasm32-unknown-unknown -p ade-planning
          cargo check --target wasm32-unknown-unknown -p ade-casebook
          cargo check --target wasm32-unknown-unknown -p ade-runtime-ports
          cargo check --target wasm32-unknown-unknown -p ade-core-api
          cargo check --target wasm32-unknown-unknown -p ade-web-storage-wasm-bridge
          cargo check --target wasm32-unknown-unknown -p ade-web-readonly-serial-wasm-bridge

  cargo-deny:
    # Supply-chain gate for ADR-0009 as narrowed by ADR-0012/ADR-0013. The product graph admits
    # only wasm-bindgen 0.2.127 at two exact bridge locations. The separate build-tool graph admits
    # only cli-support 0.2.127 and scopes Zlib to foldhash 0.2.0. cargo-deny is required for
    # both graphs -- never advisory-only and never continue-on-error.
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Report pinned toolchain
        run: cargo --version

      - name: Install cargo-deny (pinned, locked)
        run: cargo install --locked cargo-deny@0.20.2

      - name: Advisories, bans, licenses and sources
        run: |
          cargo deny check advisories
          cargo deny check bans
          cargo deny check licenses
          cargo deny check sources

      - name: Isolated WASM tooling advisories, bans, licenses and sources
        run: |
          cargo deny --manifest-path tools/wasm-bindgen-cli-support/Cargo.toml --config tools/wasm-bindgen-cli-support/deny.toml check advisories
          cargo deny --manifest-path tools/wasm-bindgen-cli-support/Cargo.toml --config tools/wasm-bindgen-cli-support/deny.toml check bans
          cargo deny --manifest-path tools/wasm-bindgen-cli-support/Cargo.toml --config tools/wasm-bindgen-cli-support/deny.toml check licenses
          cargo deny --manifest-path tools/wasm-bindgen-cli-support/Cargo.toml --config tools/wasm-bindgen-cli-support/deny.toml check sources

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Branch counters are still an unstable rustc coverage option. This is confined to
      # the exact pinned coverage build; product and MSRV builds remain stable Rust.
      RUSTC_BOOTSTRAP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Report pinned toolchain
        run: |
          cargo --version
          rustc --version

      - name: Install LLVM tools and pinned coverage driver
        run: |
          rustup component add llvm-tools-preview
          cargo install --locked cargo-llvm-cov@0.8.7

      - name: Measure line and branch coverage
        run: |
          cargo llvm-cov --workspace --all-targets --branch --json --output-path coverage.json
          python3 scripts/check_coverage.py coverage.json
