# Foundation CI.
#
# Scope note (honesty): these gates cover only what this repository actually contains
# today -- a structural workspace with zero dependencies, documentation, provenance
# records and policy scripts. Gates for Tauri, React, Vitest, Playwright, cargo-fuzz,
# property tests, serial/USB/DFU, hardware and release publishing are deliberately
# absent and are added in the same pull requests that introduce those components.
#
# Action pinning: actions are pinned to an exact release tag. Pinning to a commit SHA
# could not be completed in the environment that authored this file, because the GitHub
# API for third-party repositories was not reachable from it. Converting these tags to
# SHAs is a tracked follow-up pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-gates:
    name: policy-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Report Python version
        run: python3 --version

      - name: Isolation, dependency and publication gates
        run: python3 scripts/check_isolation.py

      - name: Unsafe-Rust gate
        run: python3 scripts/check_forbid_unsafe.py

      - name: Provenance gate
        run: python3 scripts/validate_provenance.py

      - name: Local secret-pattern scan
        run: python3 scripts/check_secrets.py

      - name: Policy script regression tests
        run: python3 -m unittest discover -s scripts/tests -v

  rust-linux:
    name: rust-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Report pinned toolchain
        run: |
          rustup show active-toolchain
          cargo --version
          rustc --version

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  rust-windows:
    name: rust-windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Report pinned toolchain
        run: |
          rustup show active-toolchain
          cargo --version
          rustc --version

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  rust-msrv:
    # Proves that the declared MSRV is real and not decorative: the workspace is checked
    # with exactly the version in Cargo.toml's rust-version, which is deliberately older
    # than the pinned development toolchain in rust-toolchain.toml. The explicit
    # `+1.85.0` overrides that pin for this job only.
    name: rust-msrv
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install declared MSRV toolchain
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Report both versions
        run: |
          echo "declared MSRV:"
          cargo +1.85.0 --version
          echo "pinned development toolchain:"
          cargo --version

      - name: Check workspace against declared MSRV
        run: cargo +1.85.0 check --workspace --all-targets
