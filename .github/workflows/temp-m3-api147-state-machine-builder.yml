name: TEMP M3 API147 State Machine Builder

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  build-state-machine:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/m3-api147-identification-state-machine'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/m3-api147-identification-state-machine
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic M3 API 1.47 read-only integration
        shell: bash
        run: python3 scripts/tmp_m3_api147_state_machine.py

      - name: Format and focused Rust validation
        shell: bash
        run: |
          cargo fmt --all
          cargo check -p ade-execution
          cargo check --locked -p ade-execution
          cargo test --locked -p ade-execution --test api147_readonly_identification
          cargo test --locked -p ade-web-readonly-serial-wasm-bridge
          node web/tests/webapp-readonly-fc-connection.test.mjs

      - name: Install canonical product and generator toolchains
        shell: bash
        run: |
          rustup toolchain install 1.85.0 --profile minimal --target wasm32-unknown-unknown
          rustup toolchain install 1.97.1 --profile minimal

      - name: Regenerate canonical read-only Web Serial product assets on trusted Linux
        shell: bash
        env:
          RUSTFLAGS: >-
            --remap-path-prefix=/home/runner/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f/wasm-bindgen-0.2.127/src/convert/slices.rs=/source/wasm-bindgen/src/convert/slices.rs
            --remap-path-prefix=/home/runner/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f/wasm-bindgen-0.2.127/src/externref.rs=/source/wasm-bindgen/src/externref.rs
            --remap-path-prefix=crates/protocol-msp/src/lib.rs=/source/project/crates/protocol-msp/src/lib.rs
        run: |
          cargo +1.85.0 build --locked --release --target wasm32-unknown-unknown -p ade-web-readonly-serial-wasm-bridge
          rm -rf target/webserial-wasm-product-regenerated
          mkdir -p target/webserial-wasm-product-regenerated
          cargo +1.97.1 run --locked --manifest-path tools/wasm-bindgen-cli-support/Cargo.toml -- \
            target/wasm32-unknown-unknown/release/ade_web_readonly_serial_wasm_bridge.wasm \
            target/webserial-wasm-product-regenerated
          cp target/webserial-wasm-product-regenerated/ade_web_readonly_serial_wasm_bridge.js \
            web/public/wasm/ade_web_readonly_serial_wasm_bridge.js
          cp target/webserial-wasm-product-regenerated/ade_web_readonly_serial_wasm_bridge_bg.wasm \
            web/public/wasm/ade_web_readonly_serial_wasm_bridge_bg.wasm

      - name: Refresh derived-asset provenance hashes only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('.')
          policy_path = root / 'policy/webserial-wasm-assets.json'
          policy = json.loads(policy_path.read_text(encoding='utf-8'))

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def git_blob_sha1(path: Path) -> str:
              content = path.read_bytes()
              header = f'blob {len(content)}\0'.encode()
              return hashlib.sha1(header + content, usedforsecurity=False).hexdigest()

          source_path = root / policy['source']['rust_source']['path']
          policy['source']['rust_source']['sha256'] = sha256(source_path)
          policy['source']['rust_source']['git_blob_sha1'] = git_blob_sha1(source_path)

          for record in policy['outputs']:
              path = root / record['path']
              record['sha256'] = sha256(path)
              record['size'] = path.stat().st_size

          policy_path.write_text(json.dumps(policy, indent=2) + '\n', encoding='utf-8')
          PY
          python3 scripts/verify_webserial_product_assets.py \
            --input-wasm target/wasm32-unknown-unknown/release/ade_web_readonly_serial_wasm_bridge.wasm \
            --generated-dir target/webserial-wasm-product-regenerated

      - name: Commit only production integration outputs
        shell: bash
        run: |
          git config user.name "FPV-Arabic"
          git config user.email "295969497+melyanneahmed-rgb@users.noreply.github.com"
          git add \
            Cargo.lock \
            crates/execution/Cargo.toml \
            crates/execution/src/lib.rs \
            crates/execution/tests/api147_readonly_identification.rs \
            crates/web-readonly-serial-wasm-bridge/src/lib.rs \
            policy/webserial-wasm-assets.json \
            web/public/wasm/ade_web_readonly_serial_wasm_bridge.js \
            web/public/wasm/ade_web_readonly_serial_wasm_bridge_bg.wasm \
            web/src/App.tsx \
            web/src/connection/readonly-fc-connection.d.mts \
            web/tests/browser/webserial-readonly-smoke.mjs \
            web/tests/webapp-readonly-fc-browser-smoke.mjs \
            web/tests/webapp-readonly-fc-connection.test.mjs
          if git diff --cached --quiet; then
            echo "production integration already present; nothing to push"
            exit 0
          fi
          git commit -m "feat(m3): integrate API 1.47 read-only identification"
          git push origin HEAD:feat/m3-api147-identification-state-machine
