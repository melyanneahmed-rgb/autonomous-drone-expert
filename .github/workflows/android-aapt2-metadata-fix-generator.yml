name: Android AAPT2 Metadata Fix Generator

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate:
    name: Generate and validate Linux aapt2 metadata fix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact accepted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 12da4aa9aa0fc0dba0a771fd4d325127494ba594
          fetch-depth: 1
          persist-credentials: false

      - name: Insert only the independently verified Linux aapt2 checksum
        shell: bash
        run: |
          set -euo pipefail
          url='https://dl.google.com/dl/android/maven2/com/android/tools/build/aapt2/9.2.1-15009934/aapt2-9.2.1-15009934-linux.jar'
          jar="$RUNNER_TEMP/aapt2-9.2.1-15009934-linux.jar"
          curl --fail --location --proto '=https' --tlsv1.2 "$url" --output "$jar"
          echo '755f6727fb3f4cce5e319eac0f3618ed4b36b49a46d4bb2cbb6fa8e9175a54d6  '"$jar" | sha256sum --check
          test "$(stat -c '%s' "$jar")" = '2347854'
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/gradle/verification-metadata.xml')
          text = path.read_text(encoding='utf-8')
          linux_name = 'aapt2-9.2.1-15009934-linux.jar'
          if linux_name in text:
              raise SystemExit('Linux aapt2 entry already exists')
          needle = '''         <artifact name="aapt2-9.2.1-15009934-windows.jar">\n            <sha256 value="ac25e699c4830b5179f138736fd6200567aa1d73acc4dff0b0ba2b73013a8cdb" origin="Generated by Gradle"/>\n         </artifact>\n'''
          if text.count(needle) != 1:
              raise SystemExit('expected Windows aapt2 anchor not found exactly once')
          addition = '''         <artifact name="aapt2-9.2.1-15009934-linux.jar">\n            <sha256 value="755f6727fb3f4cce5e319eac0f3618ed4b36b49a46d4bb2cbb6fa8e9175a54d6" origin="Verified on GitHub Actions Ubuntu from official Google Maven"/>\n         </artifact>\n'''
          path.write_text(text.replace(needle, needle + addition), encoding='utf-8')
          PY
          git diff --check
          git diff -- android/gradle/verification-metadata.xml

      - name: Validate Android policy with corrected metadata
        run: python3 scripts/check_android_validation.py

      - name: Download checksum-verified Gradle distribution
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://services.gradle.org/distributions/gradle-9.4.1-bin.zip \
            --output "$RUNNER_TEMP/gradle-9.4.1-bin.zip"
          echo '2ab2958f2a1e51120c326cad6f385153bb11ee93b3c216c5fccebfdfbb7ec6cb  '"$RUNNER_TEMP/gradle-9.4.1-bin.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/gradle-9.4.1-bin.zip" -d "$RUNNER_TEMP"

      - name: Prove strict Linux Android assemble succeeds with only this metadata addition
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-fix-validation-home
        run: |
          "$RUNNER_TEMP/gradle-9.4.1/bin/gradle" \
            --project-dir android \
            assembleDebug \
            --dependency-verification strict \
            --no-daemon \
            --stacktrace

      - name: Upload exact corrected verification metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-linux-aapt2-verification-metadata
          path: android/gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
