name: Android AAPT2 Permanent Fix Branch Writer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  write-fix-branch:
    name: Write reviewed Linux aapt2 metadata fix branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/android-linux-aapt2-verification
          fetch-depth: 1
          persist-credentials: true

      - name: Require exact locked starting point
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '12da4aa9aa0fc0dba0a771fd4d325127494ba594'
          test "$(git rev-parse 'HEAD^{tree}')" = 'bb572f1e2d76bbfdf6f75ac0e1e290bf58a96186'
          test -z "$(git status --porcelain)"

      - name: Verify official Linux aapt2 and make exact metadata-only change
        shell: bash
        run: |
          set -euo pipefail
          url='https://dl.google.com/dl/android/maven2/com/android/tools/build/aapt2/9.2.1-15009934/aapt2-9.2.1-15009934-linux.jar'
          jar="$RUNNER_TEMP/aapt2-9.2.1-15009934-linux.jar"
          curl --fail --location --proto '=https' --tlsv1.2 "$url" --output "$jar"
          echo '755f6727fb3f4cce5e319eac0f3618ed4b36b49a46d4bb2cbb6fa8e9175a54d6  '"$jar" | sha256sum --check
          test "$(stat -c '%s' "$jar")" = '2347854'
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/gradle/verification-metadata.xml')
          text = path.read_text(encoding='utf-8')
          linux_name = 'aapt2-9.2.1-15009934-linux.jar'
          if linux_name in text:
              raise SystemExit('Linux aapt2 entry already exists')
          needle = '''         <artifact name="aapt2-9.2.1-15009934-windows.jar">\n            <sha256 value="ac25e699c4830b5179f138736fd6200567aa1d73acc4dff0b0ba2b73013a8cdb" origin="Generated by Gradle"/>\n         </artifact>\n'''
          if text.count(needle) != 1:
              raise SystemExit('expected Windows aapt2 anchor not found exactly once')
          addition = '''         <artifact name="aapt2-9.2.1-15009934-linux.jar">\n            <sha256 value="755f6727fb3f4cce5e319eac0f3618ed4b36b49a46d4bb2cbb6fa8e9175a54d6" origin="Verified on GitHub Actions Ubuntu from official Google Maven"/>\n         </artifact>\n'''
          path.write_text(text.replace(needle, needle + addition), encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = 'android/gradle/verification-metadata.xml'
          git diff -- android/gradle/verification-metadata.xml
          python3 scripts/check_android_validation.py

      - name: Commit and push metadata-only fix normally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GitHub Actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/gradle/verification-metadata.xml
          git commit -m 'fix(android): verify Linux aapt2 artifact'
          git push origin HEAD:fix/android-linux-aapt2-verification
