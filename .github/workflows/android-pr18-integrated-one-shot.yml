name: Android PR18 Integrated One-Shot Validation

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  validate-apk:
    name: Build integrated PR18 validation APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact integrated PR18 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7de4c792301020d5c692af0d2452d15f26e502c3
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve and lock exact integrated PR18 source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="7de4c792301020d5c692af0d2452d15f26e502c3"
          expected_tree="ef832f60615e392d3d8519468632b6b5fa533c51"
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$source_sha" = "$expected_sha"
          test "$source_tree" = "$expected_tree"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "source_tree=$source_tree" >> "$GITHUB_OUTPUT"
          echo "short_sha=${source_sha:0:12}" >> "$GITHUB_OUTPUT"

      - name: Require successful canonical CI for exact commit
        id: ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/require_successful_ci.py "${{ steps.source.outputs.source_sha }}"

      - name: Lock exact canonical CI evidence
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.ci.outputs.commit_sha }}" = "7de4c792301020d5c692af0d2452d15f26e502c3"
          test "${{ steps.ci.outputs.tree_sha }}" = "ef832f60615e392d3d8519468632b6b5fa533c51"
          test "${{ steps.ci.outputs.ci_run_id }}" = "32339014946"
          test "${{ steps.ci.outputs.ci_run_number }}" = "133"

      - name: Install audited Web package without lifecycle scripts
        working-directory: web
        run: npx --yes npm@11.13.0 ci --ignore-scripts --no-fund

      - name: Validate audited Web and PWA source
        working-directory: web
        run: |
          npx --yes npm@11.13.0 run typecheck
          npx --yes npm@11.13.0 test

      - name: Install product MSRV with browser target
        run: rustup toolchain install 1.85.0 --profile minimal --target wasm32-unknown-unknown

      - name: Install pinned isolated generator toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Build storage-only Rust bridge at MSRV
        run: |
          cargo +1.85.0 build --locked --release --target wasm32-unknown-unknown -p ade-web-storage-wasm-bridge

      - name: Build read-only Web Serial Rust bridge at MSRV
        env:
          RUSTFLAGS: >-
            --remap-path-prefix=/home/runner/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f/wasm-bindgen-0.2.127/src/convert/slices.rs=/source/wasm-bindgen/src/convert/slices.rs
            --remap-path-prefix=/home/runner/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f/wasm-bindgen-0.2.127/src/externref.rs=/source/wasm-bindgen/src/externref.rs
            --remap-path-prefix=crates/protocol-msp/src/lib.rs=/source/project/crates/protocol-msp/src/lib.rs
        run: |
          cargo +1.85.0 build --locked --release --target wasm32-unknown-unknown -p ade-web-readonly-serial-wasm-bridge

      - name: Generate storage-only Web glue
        run: |
          mkdir -p target/storage-wasm-web
          cargo run --locked --manifest-path tools/wasm-bindgen-cli-support/Cargo.toml -- \
            target/wasm32-unknown-unknown/release/ade_web_storage_wasm_bridge.wasm \
            target/storage-wasm-web

      - name: Generate canonical read-only Web Serial Web glue
        run: |
          mkdir -p target/webserial-wasm-product-regenerated
          cargo +1.97.1 run --locked --manifest-path tools/wasm-bindgen-cli-support/Cargo.toml -- \
            target/wasm32-unknown-unknown/release/ade_web_readonly_serial_wasm_bridge.wasm \
            target/webserial-wasm-product-regenerated

      - name: Prove regenerated serial product assets reproduce byte-for-byte
        run: |
          python3 scripts/verify_webserial_product_assets.py \
            --input-wasm target/wasm32-unknown-unknown/release/ade_web_readonly_serial_wasm_bridge.wasm \
            --generated-dir target/webserial-wasm-product-regenerated

      - name: Stage exact same-origin WASM production assets
        run: |
          python3 scripts/prepare_web_wasm.py \
            --serial-root target/webserial-wasm-product-regenerated

      - name: Prove staged serial assets remain byte-identical to selected source
        run: |
          git diff --exit-code -- \
            web/public/wasm/ade_web_readonly_serial_wasm_bridge.js \
            web/public/wasm/ade_web_readonly_serial_wasm_bridge_bg.wasm

      - name: Exercise repository-subpath PWA, IndexedDB, Web Serial, and WASM
        working-directory: web
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          node --experimental-websocket tests/indexeddb-browser-smoke.mjs /autonomous-drone-expert/
          node --experimental-websocket tests/storage-wasm-browser-smoke.mjs ../target/storage-wasm-web /autonomous-drone-expert/
          node --experimental-websocket tests/webserial-readonly-browser-smoke.mjs ../target/webserial-wasm-product-regenerated /autonomous-drone-expert/
          ADE_WEB_BASE_PATH=/autonomous-drone-expert/ ADE_BUILD_SHA="$SOURCE_SHA" npx --yes npm@11.13.0 run build
          node --experimental-websocket tests/production-delivery-browser-smoke.mjs \
            dist /autonomous-drone-expert/ "$SOURCE_SHA"

      - name: Prove final Android Web dist contains canonical serial product assets
        run: |
          cmp --silent \
            web/public/wasm/ade_web_readonly_serial_wasm_bridge.js \
            web/dist/wasm/ade_web_readonly_serial_wasm_bridge.js
          cmp --silent \
            web/public/wasm/ade_web_readonly_serial_wasm_bridge_bg.wasm \
            web/dist/wasm/ade_web_readonly_serial_wasm_bridge_bg.wasm

      - name: Prove packaged PWA contains no private material
        run: python3 scripts/check_public_web_artifact.py web/dist

      - name: Validate Android authority and dependency policy
        run: python3 scripts/check_android_validation.py

      - name: Set up exact Java toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17.0.20+8"
          check-latest: false

      - name: Download checksum-verified Gradle distribution
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://services.gradle.org/distributions/gradle-9.4.1-bin.zip \
            --output "$RUNNER_TEMP/gradle-9.4.1-bin.zip"
          echo "2ab2958f2a1e51120c326cad6f385153bb11ee93b3c216c5fccebfdfbb7ec6cb  $RUNNER_TEMP/gradle-9.4.1-bin.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/gradle-9.4.1-bin.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-9.4.1/bin/gradle" --version

      - name: Compile debug validation APK from strict lock and checksums
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-user-home
        run: |
          "$RUNNER_TEMP/gradle-9.4.1/bin/gradle" \
            --project-dir android \
            assembleDebug \
            --dependency-verification strict \
            --no-daemon \
            --stacktrace

      - name: Verify, name, and hash development APK
        id: apk
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          source_apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$source_apk"
          apk_name="smart-configurator-validation-${SOURCE_SHA:0:12}-debug.apk"
          install -m 0644 "$source_apk" "$RUNNER_TEMP/$apk_name"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/$apk_name"
          apk_sha256="$(sha256sum "$RUNNER_TEMP/$apk_name" | cut -d ' ' -f1)"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"
          echo "apk_path=$RUNNER_TEMP/$apk_name" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$apk_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload development validation APK
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smart-configurator-validation-${{ steps.source.outputs.short_sha }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Write APK validation summary
        env:
          SOURCE_REF: 7de4c792301020d5c692af0d2452d15f26e502c3
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          TREE_SHA: ${{ steps.ci.outputs.tree_sha }}
          CI_RUN_URL: ${{ steps.ci.outputs.ci_run_url }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
          APK_SHA256: ${{ steps.apk.outputs.apk_sha256 }}
          ARTIFACT_NAME: smart-configurator-validation-${{ steps.source.outputs.short_sha }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          {
            echo "## Android APK packaging validation"
            echo "- Repository: \`${{ github.repository }}\`"
            echo "- Workflow: \`${{ github.workflow }}\`"
            echo "- Source ref: \`$SOURCE_REF\`"
            echo "- Commit SHA: \`$SOURCE_SHA\`"
            echo "- Tree SHA: \`$TREE_SHA\`"
            echo "- Build timestamp (UTC): \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`"
            echo "- Canonical CI: $CI_RUN_URL"
            echo "- Java: Temurin 17.0.20+8"
            echo "- Gradle: 9.4.1 (checksum verified)"
            echo "- Android Gradle Plugin: 9.2.1"
            echo "- Android Browser Helper: 2.7.2"
            echo "- Web/PWA source and browser tests: passed"
            echo "- Android debug build result: passed"
            echo "- APK: \`$APK_NAME\`"
            echo "- APK SHA-256: \`$APK_SHA256\`"
            echo "- Artifact: [$ARTIFACT_NAME]($ARTIFACT_URL)"
            echo "- Status: DEVELOPMENT / VALIDATION — NOT PRODUCTION SIGNED"
            echo "- Android USB flight-controller support: NOT VALIDATED"
            echo "- TWA Digital Asset Links verification: NOT CLAIMED; Custom Tab fallback remains enabled"
          } >> "$GITHUB_STEP_SUMMARY"
